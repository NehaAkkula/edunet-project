{% extends 'base.html' %}

{% block title %}Order Success - HomeFood Connect{% endblock %}

{% block content %}
<div class="container py-5 text-center mt-5">
    <div class="card shadow p-5 border-0 rounded-4">
        <div class="display-1 text-success mb-4">✅</div>
        <h2 class="display-4 fw-bold mb-3 serif-font">Order Placed Successfully!</h2>
        <p class="lead text-muted mb-4">Your order <strong>#{{ order.id }}</strong> for <strong>{{ order.dish.name }}</strong> has been sent to the chef.</p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{% url 'order_history' %}" class="btn btn-primary btn-lg px-4">Track Order</a>
            <a href="{% url 'menu' %}" class="btn btn-outline-secondary btn-lg px-4">Order More</a>
        </div>
    </div>
</div>
{% endblock %}
